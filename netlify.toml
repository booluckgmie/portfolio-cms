[build]
  publish = "dist"
  command = "node scripts/build.mjs"

[functions]
  directory = "netlify/functions"
  included_files = ["private/links.json"]

# One neutral endpoint for both hosts (Vercel serves api/unlock.js at the same path).
[[redirects]]
  from = "/api/unlock"
  to = "/.netlify/functions/unlock"
  status = 200

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
