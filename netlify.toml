[build]
  publish = "."
  command = "node scripts/build.mjs"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/private/links.json"]

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Publish dir is the repo root, so shadow everything that must stay private
# (the source catalog holds the real URLs of locked projects).
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/appscript.gs"
  to = "/404.html"
  status = 404
  force = true
