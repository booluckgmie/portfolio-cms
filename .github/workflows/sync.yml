name: Sync deployed projects

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # Actions tab → Run workflow, any time

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch GitHub / Netlify / Vercel
        run: node scripts/sync.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_GITHUB_TOKEN || github.token }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Commit if changed (triggers a Netlify rebuild)
        run: |
          git diff --quiet content/catalog.json && exit 0
          git config user.name  "portfolio-sync[bot]"
          git config user.email "portfolio-sync@users.noreply.github.com"
          git add content/catalog.json
          git commit -m "chore: sync deployed projects"
          git push
